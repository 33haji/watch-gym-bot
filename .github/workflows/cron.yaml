name: cron-job
on:
  schedule:
    - cron: '*/5 0-16 * * *'
permissions:
  # リアクションで追加されたskipする日付をcommitするため
  contents: write
# 1ジョブが長時間ループするため、同時に走らないようにする
# (実行中に新しく起動した分は待機し、待機中の古い分は自動でキャンセルされる)
concurrency:
  group: cron-job
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Install dependencies
        run: npm ci
      # # Unable to connect to azure.archive.ubuntu.com:http: のエラー対応
      # # https://github.com/actions/runner-images/issues/675#issuecomment-1419388451
      # - name: Install apt-spy2
      #   run: |
      #     sudo gem install apt-spy2
      #     sudo apt-spy2 fix --commit --launchpad --country=US
      #     sudo apt-get update
      # ブラウザのダウンロードが実行時間の大半を占めるためキャッシュする
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{runner.os}}-playwright-${{steps.playwright-version.outputs.version}}
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # キャッシュを使う場合もOS側の依存パッケージは入れておく
      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          USER_ID: ${{secrets.USER_ID}}
          USER_PASSWORD: ${{secrets.USER_PASSWORD}}
          SLACK_BOT_TOKEN: ${{secrets.SLACK_BOT_TOKEN}}
          SLACK_CHANNEL: ${{secrets.SLACK_CHANNEL}}
          # cronの起動が遅延・間引かれるため、1回の起動の中で繰り返し空きを確認する
          LOOP_MINUTES: 50
          CHECK_INTERVAL_SECONDS: 60
      # リアクションで追加されたskipする日付を反映する(テストが失敗した場合も反映する)
      - name: Commit skip-dates.json
        if: always()
        run: |
          if git diff --quiet -- skip-dates.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skip-dates.json
          git commit -m "skipする日付を更新"
          git pull --rebase
          git push
