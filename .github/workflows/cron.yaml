name: cron-job
on:
  schedule:
    - cron: '*/5 0-16 * * *'
permissions:
  # リアクションで追加されたskipする日付をcommitするため
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - name: Install dependencies
        run: npm ci
      # # Unable to connect to azure.archive.ubuntu.com:http: のエラー対応
      # # https://github.com/actions/runner-images/issues/675#issuecomment-1419388451
      # - name: Install apt-spy2
      #   run: |
      #     sudo gem install apt-spy2
      #     sudo apt-spy2 fix --commit --launchpad --country=US
      #     sudo apt-get update
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          USER_ID: ${{secrets.USER_ID}}
          USER_PASSWORD: ${{secrets.USER_PASSWORD}}
          SLACK_BOT_TOKEN: ${{secrets.SLACK_BOT_TOKEN}}
          SLACK_CHANNEL: ${{secrets.SLACK_CHANNEL}}
      # リアクションで追加されたskipする日付を反映する(テストが失敗した場合も反映する)
      - name: Commit skip-dates.json
        if: always()
        run: |
          if git diff --quiet -- skip-dates.json; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skip-dates.json
          git commit -m "skipする日付を更新"
          git pull --rebase
          git push
